name: CI

# Verification de toute modification (CLAUDE.md : « Tester avant toute PR »).
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - gh-pages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: TypeScript strict
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tests unitaires et composants
        run: npm run test

      - name: Build de production
        run: npm run build

  e2e:
    name: Parcours enfant (iPad paysage + 1024x768)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: npm run e2e

      - name: Conserver le rapport en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
